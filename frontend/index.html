<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Instamart Support Copilot</title>
<style>
  :root {
    --bg: #f6f5f2; --surface: #ffffff; --surface-2: #f1f0ec; --border: #e2e0da;
    --text: #1b1b19; --text-2: #5b5a55; --accent: #2a78d6; --accent-ink: #ffffff;
    --good: #1a7f4b; --warn: #a86400; --bad: #c0362c; --info: #2a78d6;
    --good-bg: #e6f4ec; --warn-bg: #fdf1dc; --bad-bg: #fbe7e5; --info-bg: #e5effb;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141413; --surface: #1d1d1b; --surface-2: #262624; --border: #34342f;
      --text: #f0efec; --text-2: #b3b2aa; --accent: #4a90e2; --accent-ink: #ffffff;
      --good: #4cc38a; --warn: #e3a33b; --bad: #f07167; --info: #6aa8ee;
      --good-bg: #17301f; --warn-bg: #352812; --bad-bg: #3a1c19; --info-bg: #182a40;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { padding: 28px 24px 8px; max-width: 1200px; margin: 0 auto; }
  h1 { margin: 0; font-size: 24px; letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--text-2); }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 16px 24px 40px;
         max-width: 1200px; margin: 0 auto; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 12px 16px 32px; } header { padding: 20px 16px 4px; } }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; min-width: 0; }
  .card h2 { margin: 0 0 4px; font-size: 18px; }
  .card .sub { margin: 0 0 16px; color: var(--text-2); font-size: 13px; }
  label { display: block; font-size: 13px; color: var(--text-2); margin: 12px 0 4px; }
  input, textarea, select { width: 100%; font: inherit; color: var(--text); background: var(--surface);
         border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; }
  textarea { resize: vertical; min-height: 64px; }
  input:focus, textarea:focus, select:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .row { display: flex; gap: 10px; align-items: flex-end; }
  .row > * { flex: 1; min-width: 0; }
  .row > button { flex: 0 0 auto; }
  button.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 8px;
         padding: 10px 18px; font: inherit; font-weight: 600; cursor: pointer; white-space: nowrap; }
  button.primary:disabled { opacity: .55; cursor: progress; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-2);
          border-radius: 999px; padding: 4px 10px; font-size: 12.5px; cursor: pointer; }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .answer { margin-top: 16px; padding: 14px; background: var(--surface-2); border-radius: 10px; }
  .answer .text { font-size: 15.5px; }
  .muted { color: var(--text-2); font-size: 12.5px; }
  .source { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
  .source .head { display: flex; justify-content: space-between; gap: 8px; font-size: 12.5px; color: var(--text-2); }
  .bar { height: 4px; background: var(--border); border-radius: 2px; margin: 6px 0; overflow: hidden; }
  .bar span { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
  .source .chunk { font-size: 13px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 13px;
           padding: 4px 10px; border-radius: 999px; }
  .badge.good { color: var(--good); background: var(--good-bg); }
  .badge.warn { color: var(--warn); background: var(--warn-bg); }
  .badge.bad { color: var(--bad); background: var(--bad-bg); }
  .badge.info { color: var(--info); background: var(--info-bg); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 14px 0; }
  .stat { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
  .stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--text-2); }
  ol.timeline { list-style: none; margin: 8px 0 0; padding: 0; }
  ol.timeline li { position: relative; padding: 0 0 14px 26px; }
  ol.timeline li::before { content: attr(data-n); position: absolute; left: 0; top: 1px; width: 18px; height: 18px;
         border-radius: 50%; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700;
         display: flex; align-items: center; justify-content: center; }
  ol.timeline li::after { content: ""; position: absolute; left: 8.5px; top: 22px; bottom: 2px; width: 1px; background: var(--border); }
  ol.timeline li:last-child::after { display: none; }
  .tool { font-family: var(--mono); font-weight: 600; font-size: 13.5px; }
  details { margin-top: 4px; }
  summary { cursor: pointer; color: var(--text-2); font-size: 12.5px; }
  pre { font-family: var(--mono); font-size: 12px; background: var(--surface-2); border-radius: 6px;
        padding: 8px 10px; margin: 6px 0 0; white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow: auto; }
  .final { margin-top: 6px; padding: 12px 14px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 8px 8px 0; }
  .error { margin-top: 12px; color: var(--bad); background: var(--bad-bg); padding: 10px 12px; border-radius: 8px; }
  footer { text-align: center; color: var(--text-2); font-size: 12.5px; padding: 0 16px 28px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script>
/* React without a build step: h() is React.createElement (no JSX, so no Babel needed). */
const { useState, useEffect } = React;
const h = React.createElement;

async function api(path, body) {
  const res = await fetch(path, body === undefined ? {} :
    { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

const SAMPLE_QUESTIONS = [
  "Who must approve a refund above INR 1000?",
  "How soon is money returned when a payment fails but is deducted?",
  "Is cash on delivery available for a large order?",
  "What is the favourite colour of the company mascot?",
];

function statusTone(status) {
  if (!status) return "info";
  if (status === "REFUND") return "good";
  if (status === "ESCALATE") return "info";
  if (status.startsWith("FALLBACK")) return "warn";
  return "bad";   // DENIED, NOT_FOUND
}

function inr(x) {
  return "INR " + Number(x || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function PolicyAssistant() {
  const [question, setQuestion] = useState("");
  const [result, setResult] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  async function ask(q) {
    const text = (q ?? question).trim();
    if (!text) return;
    setQuestion(text); setBusy(true); setError("");
    try { setResult(await api("/api/ask", { question: text })); }
    catch (e) { setError(e.message); setResult(null); }
    finally { setBusy(false); }
  }

  return h("section", { className: "card" },
    h("h2", null, "Policy assistant"),
    h("p", { className: "sub" }, "TF-IDF retrieval over the five policy documents, answered by a LangChain chain on the offline mock model."),
    h("form", { onSubmit: e => { e.preventDefault(); ask(); } },
      h("label", { htmlFor: "q" }, "Question"),
      h("div", { className: "row" },
        h("input", { id: "q", value: question, placeholder: "Ask about refunds, delivery, payments…",
                     onChange: e => setQuestion(e.target.value) }),
        h("button", { className: "primary", type: "submit", disabled: busy }, busy ? "Asking…" : "Ask"))),
    h("div", { className: "chips" },
      SAMPLE_QUESTIONS.map(q => h("button", { key: q, className: "chip", type: "button", onClick: () => ask(q) }, q))),
    error && h("div", { className: "error" }, error),
    result && h("div", { className: "answer" },
      h("div", { className: "text" }, result.answer),
      h("div", { className: "muted", style: { marginTop: 6 } }, result.engine),
      h("div", { style: { marginTop: 12 } }, h("b", null, "Retrieved context"), h("span", { className: "muted" }, "  (top 3 chunks by cosine similarity)")),
      result.chunks.map((c, i) => h("div", { key: i, className: "source" },
        h("div", { className: "head" }, h("span", null, "[" + c.source + "]"), h("span", null, "score " + c.score.toFixed(4))),
        h("div", { className: "bar" }, h("span", { style: { width: Math.min(100, c.score * 200) + "%" } })),
        h("div", { className: "chunk" }, c.text)))));
}

function RefundAgent() {
  const [scenarios, setScenarios] = useState([]);
  const [picked, setPicked] = useState("");
  const [message, setMessage] = useState("");
  const [limits, setLimits] = useState({ max_iterations: 6, token_limit: 6000, time_limit_seconds: 10 });
  const [result, setResult] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    api("/api/scenarios").then(list => {
      setScenarios(list);
      if (list.length) { setPicked(list[0].scenario_id); setMessage(list[0].message); }
    }).catch(e => setError(e.message));
  }, []);

  function choose(id) {
    setPicked(id);
    const s = scenarios.find(x => x.scenario_id === id);
    if (s) setMessage(s.message);
  }

  async function run() {
    setBusy(true); setError(""); setResult(null);
    try { setResult(await api("/api/agent", { message, scenario_id: picked, ...limits })); }
    catch (e) { setError(e.message); }
    finally { setBusy(false); }
  }

  const limitInput = (key, label, step) => h("div", null,
    h("label", { htmlFor: key }, label),
    h("input", { id: key, type: "number", min: 0, step, value: limits[key],
                 onChange: e => setLimits({ ...limits, [key]: e.target.value }) }));

  const current = scenarios.find(x => x.scenario_id === picked);

  return h("section", { className: "card" },
    h("h2", null, "Refund agent"),
    h("p", { className: "sub" }, "ReAct loop: the model asks for tools, the app runs them against the Part A database. Runs here use a separate ledger."),
    h("label", { htmlFor: "scenario" }, "Scenario"),
    h("select", { id: "scenario", value: picked, onChange: e => choose(e.target.value) },
      scenarios.map(s => h("option", { key: s.scenario_id, value: s.scenario_id },
        s.scenario_id + " · expected " + s.expected_outcome))),
    h("label", { htmlFor: "msg" }, "Customer message"),
    h("textarea", { id: "msg", value: message, onChange: e => setMessage(e.target.value) }),
    h("div", { className: "row" },
      limitInput("max_iterations", "Max model calls", 1),
      limitInput("token_limit", "Token limit", 100),
      limitInput("time_limit_seconds", "Time limit (s)", 1)),
    h("div", { style: { marginTop: 14 } },
      h("button", { className: "primary", onClick: run, disabled: busy || !message.trim() }, busy ? "Running…" : "Run agent")),
    error && h("div", { className: "error" }, error),
    result && h("div", { style: { marginTop: 18 } },
      h("div", { style: { display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" } },
        h("span", { className: "badge " + statusTone(result.status) }, result.status),
        current && h("span", { className: "muted" }, "expected " + current.expected_outcome +
          (Number(current.expected_refund_inr) ? " · " + inr(current.expected_refund_inr) : ""))),
      h("div", { className: "stats" },
        h("div", { className: "stat" }, h("b", null, inr(result.refund_inr)), h("span", null, "refund")),
        h("div", { className: "stat" }, h("b", null, result.llm_calls), h("span", null, "model calls")),
        h("div", { className: "stat" }, h("b", null, result.tokens_used.toLocaleString("en-IN")), h("span", null, "tokens"))),
      h("b", null, "Steps"),
      result.steps.length === 0 ? h("p", { className: "muted" }, "No tool was executed.") :
      h("ol", { className: "timeline" }, result.steps.map(s => h("li", { key: s.step, "data-n": s.step },
        h("div", { className: "tool" }, s.tool),
        h("div", { className: "muted" }, JSON.stringify(s.arguments)),
        h("details", null, h("summary", null, "observation"), h("pre", null, JSON.stringify(s.observation, null, 2)))))),
      h("div", { className: "final" }, h("div", { className: "muted" }, "Final answer"), result.final_answer)));
}

function App() {
  return h(React.Fragment, null,
    h("header", null,
      h("h1", null, "Instamart Support Copilot"),
      h("p", null, "Part D · policy question answering and refund decisions · fully offline, no API key")),
    h("main", null, h(PolicyAssistant), h(RefundAgent)),
    h("footer", null, "Synthetic data for a capstone project. Amounts in INR."));
}

ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
